name: CI

on:
  push: {}
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    
    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    
    - name: Install maturin
      run: |
        source $HOME/.cargo/env
        pip install maturin
    
    - name: Build wheels
      run: |
        source $HOME/.cargo/env
        maturin build --release --out dist
    
    - name: Install wheel
      run: pip install dist/*.whl
    
    - name: Install test dependencies
      run: pip install ".[all]" pytest httpx anyio
    
    - name: Run Python tests
      run: |
        # Clear PYTHONPATH to ensure we test the installed wheel, not the local source
        export PYTHONPATH=
        pytest tests/ -v --tb=short
    
    - name: Run benchmarks (smoke test)
      run: |
        export PYTHONPATH=
        python benchmarks/test_10k.py

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false
    
    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Run Rust tests
      run: |
        source $HOME/.cargo/env
        cargo test --verbose

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false
    
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '18'
    
    - name: Install TypeScript dependencies
      working-directory: client-ts
      run: npm ci
    
    - name: Build TypeScript client
      working-directory: client-ts
      run: npm run build
    
    - name: TypeScript type check
      working-directory: client-ts
      run: npx tsc --noEmit

    - name: Run TypeScript tests
      working-directory: client-ts
      run: npm test

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    
    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install code quality tools
      run: pip install black ruff
    
    - name: Run black (check only)
      run: black --check .
    
    - name: Run ruff
      run: ruff check .
    
    - name: Check Rust formatting
      run: |
        source $HOME/.cargo/env
        cargo fmt --check

    - name: Run Clippy (Rust linter)
      run: |
        source $HOME/.cargo/env
        cargo clippy -- -D warnings

  # Gate job - todos os jobs críticos devem passar
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-python, test-rust, test-typescript, code-quality, test-integration]
    steps:
    - name: All tests passed
      run: echo "✅ All critical tests passed! Ready for release."

  # Teste de integração
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '18'
    
    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    
    - name: Install maturin
      run: |
        source $HOME/.cargo/env
        pip install maturin
    
    - name: Build wheels
      run: |
        source $HOME/.cargo/env
        maturin build --release --out dist
    
    - name: Install wheel
      run: pip install dist/*.whl
    
    - name: Install Python dependencies
      run: pip install pydantic numpy
    
    - name: Install TypeScript dependencies
      working-directory: client-ts
      run: |
        npm ci
        npm install --save-dev @types/node
    
    - name: Build TypeScript client
      working-directory: client-ts
      run: npm run build
    
    - name: Compile integration test
      working-directory: client-ts
      run: npx tsc -p tsconfig.json
    
    - name: Generate test data (Python)
      run: python tests/test_integration_types.py
    
    - name: Verify test data was created
      run: |
        ls -lh /tmp/bfast_typed_test.bin
        ls -lh /tmp/bfast_typed_expected.json
        echo "Binary size: $(stat -c%s /tmp/bfast_typed_test.bin) bytes"
    
    - name: Run TypeScript integration test
      working-directory: client-ts
      run: node dist/tests/type-preservation.test.js
