name: CodSpeed

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'python/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'python/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Install dependencies and build extension
        run: |
          source $HOME/.cargo/env
          python -m pip install --upgrade pip
          pip install maturin pytest-codspeed pydantic numpy lz4
          maturin develop --release

      - name: Run benchmarks
        uses: CodSpeedHQ/action@1d13896ef15fbc335e350f1356d4762be9bc1df9 # v3
        with:
          run: pytest benchmarks/bench_codspeed.py --codspeed
