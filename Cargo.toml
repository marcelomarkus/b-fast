[package]
name = "b_fast"
version = "1.4.0"
edition = "2021"

[lib]
name = "b_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
ahash = "0.8"
lz4_flex = "0.14"
serde = { version = "1.0", features = ["derive"] }
numpy = "0.20"
chacha20poly1305 = "0.11"
thiserror = "2.0"
rayon = "1.10"

[build-dependencies]
maturin = "1.4"