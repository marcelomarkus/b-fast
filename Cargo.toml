[package]
name = "b_fast"
version = "1.9.0"
edition = "2021"

[lib]
name = "b_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
ahash = "0.8"
lz4_flex = "0.14"
serde = { version = "1.0", features = ["derive"] }
numpy = "0.23"
chacha20poly1305 = "0.11"
thiserror = "2.0"
rayon = "1.10"
libc = "0.2"

[build-dependencies]
maturin = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1